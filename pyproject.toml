[project]
name = "eduai"
version = "0.4.0"
description = "A small language model that gives early-level coding help on weaker PCs, for schools"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "psutil>=5.9", "fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
eduai = "eduai.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
