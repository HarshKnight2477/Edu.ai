[project]
name = "edulite"
version = "0.4.0"
description = "Lightweight, offline AI tutor for programming and AI"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "psutil>=5.9", "fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
edulite = "edulite.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
